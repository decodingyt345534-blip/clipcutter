<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Cutter</title>
<style>
  :root { --bg:#14171c; --panel:#1d222a; --line:#2e3540; --text:#e8ebf0; --mute:#8b95a5; --accent:#ffb020; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { color: var(--mute); margin: 0 0 20px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  input[type=file] { width: 100%; color: var(--text); }
  video { width: 100%; border-radius: 8px; margin-top: 12px; display: none; background: #000; }
  .row { display: flex; gap: 10px; align-items: end; margin-top: 12px; }
  .row > div { flex: 1; }
  label { display: block; font-size: .85rem; color: var(--mute); margin-bottom: 4px; }
  input[type=number] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 1rem; }
  button { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: .9rem; cursor: pointer; }
  button.main { width: 100%; margin-top: 14px; padding: 14px; background: var(--accent); color: #1a1200; border: 0; font-weight: 700; font-size: 1rem; }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chk { display: flex; gap: 8px; align-items: center; margin-top: 14px; color: var(--mute); font-size: .9rem; }
  #msg { margin-top: 12px; color: var(--mute); min-height: 1.2em; }
  #result { margin-top: 12px; }
  #result a { color: var(--accent); }
